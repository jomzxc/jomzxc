<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Joms — software engineer, full-stack web and speech AI">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#000000" opacity="0.07"/>
    </pattern>
    <style>
      .sans { font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .line { opacity: 0; animation: cycle 12s infinite; }
      .l2 { animation-delay: 4s; }
      .l3 { animation-delay: 8s; }
      @keyframes cycle { 0% {opacity:0} 4% {opacity:1} 30% {opacity:1} 34% {opacity:0} 100% {opacity:0} }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="14" fill="#fafafa"/>
  <rect width="1200" height="320" rx="14" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#000000" stroke-opacity="0.12"/>

  <!-- top rule -->
  <text x="64" y="64" class="mono" font-size="14" fill="#737373" letter-spacing="2">~/JOMZXC</text>
  <text x="1136" y="64" class="mono" font-size="14" fill="#737373" text-anchor="end" letter-spacing="2">PH · UTC+8</text>
  <line x1="64" y1="84" x2="1136" y2="84" stroke="#000000" stroke-opacity="0.12"/>

  <!-- name -->
  <text x="60" y="196" class="sans" font-size="104" font-weight="800" fill="#0a0a0a" letter-spacing="-4">Joms.</text>

  <!-- rotating line -->
  <g class="mono" font-size="20" fill="#404040">
    <text x="64" y="246" class="line l1">&gt; software engineer — full-stack web &amp; speech ai</text>
    <text x="64" y="246" class="line l2">&gt; building open filipino speech ai at tinig labs</text>
    <text x="64" y="246" class="line l3">&gt; open to full-time roles · dec 2026</text>
  </g>

  <!-- right-side mark: waveform -->
  <g transform="translate(860,150)" stroke="#0a0a0a" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="0"   y1="-8"  x2="0"   y2="8"/>
    <line x1="18"  y1="-22" x2="18"  y2="22"/>
    <line x1="36"  y1="-40" x2="36"  y2="40"/>
    <line x1="54"  y1="-16" x2="54"  y2="16"/>
    <line x1="72"  y1="-56" x2="72"  y2="56"/>
    <line x1="90"  y1="-30" x2="90"  y2="30"/>
    <line x1="108" y1="-46" x2="108" y2="46"/>
    <line x1="126" y1="-12" x2="126" y2="12"/>
    <line x1="144" y1="-34" x2="144" y2="34"/>
    <line x1="162" y1="-20" x2="162" y2="20"/>
    <line x1="180" y1="-50" x2="180" y2="50"/>
    <line x1="198" y1="-26" x2="198" y2="26"/>
    <line x1="216" y1="-10" x2="216" y2="10"/>
    <line x1="234" y1="-4"  x2="234" y2="4"/>
  </g>

  <!-- bottom rule -->
  <line x1="64" y1="276" x2="1136" y2="276" stroke="#000000" stroke-opacity="0.12"/>
  <rect x="1124" y="288" width="12" height="2" fill="#0a0a0a" class="cursor"/>
</svg>
