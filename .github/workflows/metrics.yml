name: metrics

on:
  schedule:
    - cron: "30 16 * * *" # daily, 00:30 Manila time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      max-parallel: 1 # both variants commit to main; run one at a time
      matrix:
        include:
          - theme: light
            text: "#121417"
            muted: "#73787F"
            accent: "#3730E8"
            c0: "#EEF0F3"
            c1: "#C9C7FB"
            c2: "#958FF5"
            c3: "#5B54EE"
            c4: "#3730E8"
          - theme: dark
            text: "#FFFFFF"
            muted: "#8B9098"
            accent: "#8A85FF"
            c0: "#1C1F25"
            c1: "#2E2A7A"
            c2: "#4A43C4"
            c3: "#6F69F2"
            c4: "#A9A5FF"
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: jomzxc
          filename: metrics-${{ matrix.theme }}.svg
          committer_message: "chore: update ${{ matrix.theme }} metrics [skip ci]"
          template: classic
          config_timezone: Asia/Manila
          config_display: large
          base: header, activity, community, repositories
          repositories_affiliations: owner, collaborator, organization_member

          # contributions calendar + streaks
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # PRs merged into other people's repos
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: pull_request, commit

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, jupyter notebook, dockerfile, shell

          # jssabater.online palette: ink text, indigo accents, indigo calendar
          extras_css: |
            :root, body, h2, .field, .row, section { color: ${{ matrix.text }} !important; }
            .gray, small, .subtitle { color: ${{ matrix.muted }} !important; }
            h2 svg, .field > svg { fill: ${{ matrix.accent }} !important; }
            [fill="#ebedf0"] { fill: ${{ matrix.c0 }} !important; }
            [fill="#9be9a8"] { fill: ${{ matrix.c1 }} !important; }
            [fill="#40c463"] { fill: ${{ matrix.c2 }} !important; }
            [fill="#30a14e"] { fill: ${{ matrix.c3 }} !important; }
            [fill="#216e39"] { fill: ${{ matrix.c4 }} !important; }
            .bar, .language { filter: grayscale(100%); }
