name: metrics

on:
  schedule:
    - cron: "30 16 * * *" # daily, 00:30 Manila time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      max-parallel: 1 # both variants commit to main; run one at a time
      matrix:
        include:
          - theme: light
            text: "#0a0a0a"
            muted: "#737373"
          - theme: dark
            text: "#e6e6e6"
            muted: "#8a8a8a"
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: jomzxc
          filename: metrics-${{ matrix.theme }}.svg
          committer_message: "chore: update ${{ matrix.theme }} metrics [skip ci]"
          template: classic
          config_timezone: Asia/Manila
          config_display: large
          base: header, activity, community, repositories
          repositories_affiliations: owner, collaborator, organization_member

          # contributions calendar + streaks
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # recent commits / PRs / reviews (private repo names hidden)
          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 30
          plugin_activity_filter: push, pr, review, ref/create, release
          plugin_activity_visibility: public
          plugin_activity_timestamps: yes

          # PRs merged into other people's repos
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: pull_request, commit

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, jupyter notebook, dockerfile, shell

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B

          # monochrome: greyscale every colour, then set text tone per theme
          extras_css: |
            svg, body { filter: grayscale(100%); }
            :root, body, h2, .field, .row, section { color: ${{ matrix.text }} !important; }
            .gray, small, .subtitle { color: ${{ matrix.muted }} !important; }
            svg .field svg, .field svg { fill: currentColor; }
