name: contribution snake

on:
  schedule:
    - cron: "0 16 * * *" # daily, midnight Manila time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#FFC53D&color_dots=#EEF0F3,#C9C7FB,#958FF5,#5B54EE,#3730E8
            dist/snake-dark.svg?color_snake=#FFC53D&color_dots=#1C1F25,#2E2A7A,#4A43C4,#6F69F2,#A9A5FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
